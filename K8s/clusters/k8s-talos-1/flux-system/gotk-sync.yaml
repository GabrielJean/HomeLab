---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: k8s-migration
  url: https://github.com/GabrielJean/HomeLab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./K8s/clusters/k8s-talos-1
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
