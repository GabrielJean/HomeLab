apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-breakglass
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab-infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-breakglass
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-breakglass
    namespace: headlamp
---
# Static ServiceAccount Token Secret for headlamp-breakglass (emergency fallback)
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-breakglass-token
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-breakglass
type: kubernetes.io/service-account-token
