apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        config: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: k8s-talos-1
              cluster:
                server: https://192.168.10.15:6443
                insecure-skip-tls-verify: true
            - name: k8s-talos-2
              cluster:
                server: https://192.168.15.15:6443
                insecure-skip-tls-verify: true
          contexts:
            - name: k8s-talos-1
              context:
                cluster: k8s-talos-1
                user: oidc
            - name: k8s-talos-2
              context:
                cluster: k8s-talos-2
                user: oidc
          current-context: ${CLUSTER_NAME:=k8s-talos-1}
          users:
            - name: oidc
              user:
                auth-provider:
                  name: oidc
                  config:
                    idp-issuer-url: "https://login.microsoftonline.com/10b7061b-f2d0-4778-8cae-2666faf4af25/v2.0"
                    client-id: "e1d55ddd-3453-4a91-9842-aa7d7dc620a3"
                    client-secret: "{{ .OIDC_CLIENT_SECRET }}"
                    scope: "openid,profile,email,offline_access"
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: k8s-app-secret
