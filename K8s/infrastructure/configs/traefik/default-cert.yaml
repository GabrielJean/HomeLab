apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: traefik-selfsigned-issuer
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: homelab-infrastructure
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default-cert
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: homelab-infrastructure
spec:
  secretName: traefik-default-cert
  issuerRef:
    name: traefik-selfsigned-issuer
    kind: Issuer
  commonName: "*.gwebs.ca"
  dnsNames:
    - "*.gwebs.ca"
    - "gwebs.ca"
