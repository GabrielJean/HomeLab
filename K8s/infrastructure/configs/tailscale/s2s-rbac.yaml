apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-s2s-sa
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-lan-s2s
    app.kubernetes.io/part-of: homelab-infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-s2s-role
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-lan-s2s
    app.kubernetes.io/part-of: homelab-infrastructure
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resourceNames: ["tailscale-s2s-state"]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-s2s-rolebinding
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-lan-s2s
    app.kubernetes.io/part-of: homelab-infrastructure
subjects:
  - kind: ServiceAccount
    name: tailscale-s2s-sa
    namespace: tailscale
roleRef:
  kind: Role
  name: tailscale-s2s-role
  apiGroup: rbac.authorization.k8s.io

