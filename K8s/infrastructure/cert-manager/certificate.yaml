apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cluster-cert
  namespace: traefik
spec:
  secretName: wildcard-cluster-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "${CLUSTER_NAME:=talos-1}.gwebs.ca"
    - "*.${CLUSTER_NAME:=talos-1}.gwebs.ca"

