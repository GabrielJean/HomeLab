apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-dns-secret
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: azure-dns-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: k8s-app-secret

