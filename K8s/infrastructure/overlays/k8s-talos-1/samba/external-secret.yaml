apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: samba-secrets
  namespace: samba
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/part-of: homelab-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: samba-credentials
    creationPolicy: Owner
  data:
    - secretKey: SAMBA_PASSWORD
      remoteRef:
        key: gabriel-samba-password
