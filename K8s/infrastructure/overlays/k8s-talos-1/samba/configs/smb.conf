[global]
   workgroup = WORKGROUP
   server string = Samba Server (HomeLab)
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   obey pam restrictions = yes
   unix password sync = yes
   map to guest = Bad User
   usershare allow guests = no

[Medias]
   path = /mnt/Vault/Medias
   read only = no
   browsable = yes
   guest ok = no
   valid users = gabriel
   force group = medias
   create mask = 0660
   directory mask = 0770

[Lightroom]
   path = /mnt/Vault/Lightroom
   read only = no
   browsable = yes
   guest ok = no
   valid users = gabriel
   force user = gabriel
   create mask = 0644
   directory mask = 0755

