apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-operator
    app.kubernetes.io/part-of: homelab-infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-k8s-client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-k8s-secret
