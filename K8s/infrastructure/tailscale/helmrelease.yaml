apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    operatorConfig:
      hostname: "talos-1-tailscale-operator"
      defaultTags:
        - "tag:k8s-operator"
      logging: "info"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
