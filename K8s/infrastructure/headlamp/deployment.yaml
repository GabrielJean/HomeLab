apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101

      # Shared in-memory volume for Headlamp plugins
      volumes:
        - name: plugins-dir
          emptyDir: {}

      # InitContainers pre-load plugins before Headlamp boots
      initContainers:
        - name: install-flux-plugin
          image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /headlamp/plugins && cp -r /plugins/* /headlamp/plugins/
          volumeMounts:
            - name: plugins-dir
              mountPath: /headlamp/plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          imagePullPolicy: IfNotPresent
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
            # OIDC SSO (Microsoft Entra ID) - Uncomment and populate when enabling SSO:
            # - "-oidc-idp-issuer-url=https://login.microsoftonline.com/<TENANT_ID>/v2.0"
            # - "-oidc-client-id=<ENTRA_CLIENT_ID>"
            # - "-oidc-client-secret=<ENTRA_CLIENT_SECRET>"
            # - "-oidc-scopes=openid,profile,email,offline_access"
            # - "-oidc-use-pkce=true"
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          volumeMounts:
            - name: plugins-dir
              mountPath: /headlamp/plugins
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

