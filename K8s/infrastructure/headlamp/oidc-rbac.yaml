# Grant cluster-admin privileges to Microsoft Entra ID authenticated users
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admin
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  # Primary cluster administrator identity from Entra ID
  - kind: User
    name: "${OIDC_ADMIN_EMAIL:=admin@example.com}"
    apiGroup: rbac.authorization.k8s.io
