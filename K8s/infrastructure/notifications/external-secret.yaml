apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pushover-credentials
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: pushover-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        address: "https://api.pushover.net/1/messages.json?token={{ .PUSHOVER_TOKEN }}&user={{ .PUSHOVER_USER_KEY }}&title=%5B${CLUSTER_NAME:=talos-1}%5D+Flux+Reconciliation+Failure"
  data:
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: pushover-token
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: pushover-user-key
