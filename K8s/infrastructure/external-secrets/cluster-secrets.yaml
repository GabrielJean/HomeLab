apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: cluster-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_ADMIN_EMAIL
      remoteRef:
        key: headlamp-admin-email

