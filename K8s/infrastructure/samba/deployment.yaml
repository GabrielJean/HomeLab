apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: samba
  labels:
    app.kubernetes.io/name: samba
    app.kubernetes.io/part-of: homelab-storage
spec:
  replicas: ${SAMBA_REPLICAS:=0}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: samba
  template:
    metadata:
      labels:
        app.kubernetes.io/name: samba
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: samba
          image: dockurr/samba:latest
          command:
            - sh
            - -c
            - |
              getent group medias >/dev/null 2>&1 || groupadd -g 950 medias
              exec /sbin/tini -- /usr/bin/samba.sh
          securityContext:
            privileged: true
          env:
            - name: USER
              value: "gabriel"
            - name: UID
              value: "1000"
            - name: GROUP
              value: "gabriel"
            - name: GID
              value: "1000"
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: samba-credentials
                  key: SAMBA_PASSWORD
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          volumeMounts:
            - name: vault-storage
              mountPath: /mnt/Vault
            - name: config
              mountPath: /etc/samba/smb.conf
              subPath: smb.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: vault-storage
          persistentVolumeClaim:
            claimName: samba-vault-pvc
        - name: config
          configMap:
            name: samba-config
