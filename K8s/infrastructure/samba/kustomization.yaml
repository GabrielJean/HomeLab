apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: samba

resources:
  - namespace.yaml
  - external-secret.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml

configMapGenerator:
  - name: samba-config
    files:
      - configs/smb.conf
    options:
      labels:
        app.kubernetes.io/name: samba
        app.kubernetes.io/part-of: homelab-storage
