# ==============================================================================
# Sidero Omni Installation Media Preset: talos-2 (Home 2 / pve-2)
# ==============================================================================
# Defines the customized Talos boot media configuration for Home 2:
# - Platform: NoCloud (for Proxmox Cloud-Init static network and metadata)
# - Talos Version: 1.14.4 (amd64, no secure boot)
# - System Extensions:
#     - siderolabs/qemu-guest-agent
# - Initial Label: pve-2 (automatically matches MachineClass pve-2)
#
# Apply to Omni:
#   omnictl apply -f Omni/media/talos-2.yaml
# ==============================================================================

metadata:
  namespace: default
  type: InstallationMediaConfigs.omni.sidero.dev
  id: talos-2
spec:
  talosversion: "1.14.4"
  architecture: 1 # amd64
  cloud:
    platform: nocloud
  secureboot: false
  installextensions:
    - siderolabs/qemu-guest-agent
  machinelabels:
    pve-2: ""

