# ==============================================================================
# Sidero Omni Installation Media Preset: talos-1 (Home 1 / pve-1)
# ==============================================================================
# Defines the customized Talos boot media configuration for Home 1:
# - Platform: NoCloud (for Proxmox Cloud-Init static network and metadata)
# - Talos Version: 1.14.4 (amd64, no secure boot)
# - System Extensions:
#     - siderolabs/qemu-guest-agent
#     - siderolabs/nonfree-kmod-nvidia-lts (v580)
#     - siderolabs/nvidia-container-toolkit-lts
# - Initial Label: pve-1 (automatically matches MachineClass pve-1)
#
# Apply to Omni:
#   omnictl apply -f Omni/media/talos-1.yaml
# ==============================================================================

metadata:
  namespace: default
  type: InstallationMediaConfigs.omni.sidero.dev
  id: talos-1
spec:
  talosversion: "1.14.4"
  architecture: 1 # amd64
  cloud:
    platform: nocloud
  secureboot: false
  installextensions:
    - siderolabs/qemu-guest-agent
    - siderolabs/nonfree-kmod-nvidia-lts
    - siderolabs/nvidia-container-toolkit-lts
  machinelabels:
    pve-1: ""

