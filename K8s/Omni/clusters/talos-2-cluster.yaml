kind: Cluster
name: k8s-talos-2
kubernetes:
  version: v1.37.1
talos:
  version: v1.14.4
features:
  backupConfiguration:
    interval:
      seconds: 3600
      nanos: 0
patches:
  - name: allow-controlplane-scheduling
    file: patches/allow-controlplane.yaml
  - name: flannel-network-policies
    file: patches/flannel-network-policies.yaml
---
kind: ControlPlane
machineClass:
  name: pve-2
  size: 1
