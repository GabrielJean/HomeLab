kind: Cluster
name: k8s-talos-1
kubernetes:
  version: v1.37.1
talos:
  version: v1.14.4
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/nonfree-kmod-nvidia-lts
  - siderolabs/nvidia-container-toolkit-lts
features:
  backupConfiguration:
    interval: 1h
patches:
  - name: allow-controlplane-workloads
    file: patches/allow-controlplane.yaml
  - name: flannel-network-policies
    file: patches/flannel-network-policies.yaml
  - name: site-to-site-routes
    file: patches/routes-talos-1.yaml
  - name: sa-issuer
    file: patches/service-account-issuer-talos-1.yaml
  - name: oidc-auth
    file: patches/oidc-azure-ad.yaml
  - name: virtiofs-vault
    file: patches/virtiofs-vault.yaml
  - name: nvidia
    file: patches/nvidia.yaml
---
kind: ControlPlane
machineClass:
  name: pve-1
  size: 1
