kind: Cluster
name: k8s-talos-1
kubernetes:
  version: v1.37.1
talos:
  version: v1.14.4
features:
  backupConfiguration:
    interval: 1h
patches:
  - name: allow-controlplane-workloads
    file: patches/allow-controlplane.yaml
  - name: flannel-network-policies
    file: patches/flannel-network-policies.yaml
  - name: site-to-site-routes
    file: patches/routes-talos-1.yaml
---
kind: ControlPlane
machineClass:
  name: pve-1
  size: 1
