# Example static network and routing configuration for Talos v1.14+
# To use: Adjust interface name (e.g. eth0 / enp0s3), IP, gateway, and DNS,
# then reference this file under `ControlPlane.patches` in your cluster template.

apiVersion: v1alpha1
kind: LinkConfig
name: eth0
up: true
addresses:
  - address: 192.168.10.50/24
routes:
  - gateway: 192.168.10.1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.10.2   # Local AdGuard Home DNS
  - address: 1.1.1.1

