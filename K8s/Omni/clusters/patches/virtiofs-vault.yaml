# Mounts native Proxmox ZFS pool into talos-1 via virtiofs.
# Hypervisor device is configured on VM with tag: Vault
# Filesystem is automatically mounted by Talos at /var/mnt/vault
apiVersion: v1alpha1
kind: ExternalVolumeConfig
name: vault
filesystemType: virtiofs
mount:
  virtiofs:
    tag: Vault
