# Static routing patch for Home 2 (talos-2 / pve-2)
# Cloud-Init configures the node's static IP and DNS nameservers.
# This patch defines the routing table on eth0:
# 1. Default gateway for internet and Omni SaaS connectivity (192.168.15.1)
# 2. Site-to-site route to Home 1 (192.168.10.0/24) via local Tailscale router (192.168.15.7)

machine:
  network:
    interfaces:
      - interface: eth0
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.15.1
          - network: 192.168.10.0/24
            gateway: 192.168.15.7

