# ==============================================================================
# Sidero Omni S3 Backup Configuration
# ==============================================================================
# Applies S3 object storage credentials and bucket targets to Omni for automated
# etcd backups of managed clusters.
#
# Usage:
#   1. Copy this file:
#      cp K8s/Omni/backups/s3-backup-config.example.yaml K8s/Omni/backups/s3-backup-config.yaml
#   2. Fill in your S3 provider details and credentials.
#   3. Apply to Omni:
#      omnictl apply -f K8s/Omni/backups/s3-backup-config.yaml
#   4. Verify connection status:
#      omnictl get etcdbackupoverallstatus
# ==============================================================================

apiVersion: omni.sidero.dev/v1alpha1
kind: EtcdBackupS3Configs
metadata:
  namespace: default
  id: etcd-backup-s3-conf
spec:
  # Name of your S3 bucket (e.g., "homelab-omni-backups")
  bucket: homelab-omni-backups

  # S3 Region (e.g., "us-east-1", "auto" for Cloudflare R2, etc.)
  region: us-east-1

  # Endpoint URL:
  # - AWS S3: Omit or set to "https://s3.amazonaws.com"
  # - MinIO / TrueNAS: "http://192.168.10.12:9000" or your MinIO URL
  # - Cloudflare R2: "https://<account-id>.r2.cloudflarestorage.com"
  # - Backblaze B2: "https://s3.<region>.backblazeb2.com"
  endpoint: https://s3.amazonaws.com

  # S3 API Access Key ID
  accesskeyid: YOUR_S3_ACCESS_KEY_ID

  # S3 API Secret Access Key
  secretaccesskey: YOUR_S3_SECRET_ACCESS_KEY

