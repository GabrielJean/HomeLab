apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/termix
  - external-secret.yaml
  - replication-destination.yaml

patches:
  - target:
      kind: Deployment
      name: termix
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

