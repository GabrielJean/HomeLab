apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-termix-secret
  namespace: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: volsync-termix-secret
    creationPolicy: Owner
    template:
      data:
        RESTIC_REPOSITORY: "azure:volsync:/termix"
        AZURE_ACCOUNT_NAME: "gjtalossa"
        AZURE_ACCOUNT_KEY: "{{ .storageAccountKey }}"
        RESTIC_PASSWORD: "{{ .resticPassword }}"
  data:
    - secretKey: storageAccountKey
      remoteRef:
        key: azure-storage-account-key
    - secretKey: resticPassword
      remoteRef:
        key: volsync-restic-password

