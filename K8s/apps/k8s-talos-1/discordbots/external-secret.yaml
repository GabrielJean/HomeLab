apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discordbots-secrets
  namespace: discordbots
  labels:
    app.kubernetes.io/name: discordbots
    app.kubernetes.io/part-of: homelab-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: discordbots-secrets
    creationPolicy: Owner
  data:
    - secretKey: JOKEBOT_DISCORD_TOKEN
      remoteRef:
        key: jokebot-discord-token
    - secretKey: XAI_API_KEY
      remoteRef:
        key: xai-api-key
    - secretKey: MUSICBOT_DISCORD_TOKEN
      remoteRef:
        key: musicbot-discord-token

