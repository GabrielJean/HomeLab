apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discordbots-data
  namespace: discordbots
  labels:
    app.kubernetes.io/name: discordbots
    app.kubernetes.io/part-of: homelab-apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

