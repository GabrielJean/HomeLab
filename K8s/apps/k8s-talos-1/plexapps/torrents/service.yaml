apiVersion: v1
kind: Service
metadata:
  name: torrents
  namespace: plexapps
  labels:
    app.kubernetes.io/name: torrents
    app.kubernetes.io/part-of: homelab-media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: torrents
  ports:
    - name: qbittorrent
      port: 8087
      targetPort: 8087
      protocol: TCP
    - name: transmission
      port: 9091
      targetPort: 9091
      protocol: TCP
