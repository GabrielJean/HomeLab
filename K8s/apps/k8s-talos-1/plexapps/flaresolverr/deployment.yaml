apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: homelab-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-1
      containers:
        - name: flaresolverr
          image: flaresolverr/flaresolverr:v3.5.2
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: "none"
            - name: TZ
              value: Europe/London
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
