apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config
  namespace: plexapps
  labels:
    app.kubernetes.io/name: overseerr
    app.kubernetes.io/part-of: homelab-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
