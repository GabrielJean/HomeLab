apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: overseerr
    app.kubernetes.io/part-of: homelab-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: overseerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overseerr
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-1
      containers:
        - name: overseerr
          image: sctx/overseerr:1.35.0
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: TZ
              value: America/Toronto
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: overseerr-config
