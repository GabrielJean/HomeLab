apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overseerr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: overseerr
    app.kubernetes.io/part-of: homelab-media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "overseerr.talos-1.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: overseerr
          port: 5055
