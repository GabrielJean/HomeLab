apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pia-secrets
  namespace: plexapps
  labels:
    app.kubernetes.io/name: gluetun
    app.kubernetes.io/part-of: homelab-media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: pia-credentials
    creationPolicy: Owner
  data:
    - secretKey: PIA_USERNAME
      remoteRef:
        key: pia-username
    - secretKey: PIA_PASSWORD
      remoteRef:
        key: pia-password
