apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upsnap
  namespace: upsnap
  labels:
    app.kubernetes.io/name: upsnap
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "upsnap.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: upsnap
          port: 8090

