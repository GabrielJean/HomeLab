apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: termix
  namespace: termix
  labels:
    app.kubernetes.io/name: termix
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "termix.${CLUSTER_NAME:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: termix
          port: 8080

