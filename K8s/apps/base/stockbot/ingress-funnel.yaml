apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockbot-funnel
  namespace: stockbot
  labels:
    app.kubernetes.io/name: stockbot
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - stockbot
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockbot
                port:
                  number: 8000

