apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stockbot
  namespace: stockbot
  labels:
    app.kubernetes.io/name: stockbot
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "stockbot.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stockbot
          port: 8000
