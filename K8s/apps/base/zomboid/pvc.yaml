apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zomboid-server-files
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid
    app.kubernetes.io/part-of: homelab-gaming
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zomboid-server-data
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid
    app.kubernetes.io/part-of: homelab-gaming
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
