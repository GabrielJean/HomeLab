apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zomboid-secrets
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid
    app.kubernetes.io/part-of: homelab-gaming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: zomboid-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_USERNAME
      remoteRef:
        key: zomboid-admin-username
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: zomboid-admin-password
    - secretKey: RCON_PASSWORD
      remoteRef:
        key: zomboid-admin-password
