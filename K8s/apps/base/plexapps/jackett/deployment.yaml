apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: plexapps
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/part-of: homelab-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jackett
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jackett
    spec:
      priorityClassName: app-low
      nodeSelector:
        kubernetes.io/hostname: talos-1
      containers:
        - name: jackett
          image: linuxserver/jackett:0.24.3047
          env:
            - name: PUID
              value: "950"
            - name: PGID
              value: "950"
            - name: TZ
              value: America/Toronto
            - name: AUTO_UPDATE
              value: "true"
          ports:
            - name: http
              containerPort: 9117
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jackett-config
