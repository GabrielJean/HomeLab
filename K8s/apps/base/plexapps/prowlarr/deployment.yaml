apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: homelab-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-1
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.6.5
          env:
            - name: PUID
              value: "950"
            - name: PGID
              value: "950"
            - name: TZ
              value: America/Toronto
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
