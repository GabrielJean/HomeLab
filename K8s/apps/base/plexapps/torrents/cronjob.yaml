apiVersion: v1
kind: ServiceAccount
metadata:
  name: torrents-restarter
  namespace: plexapps
  labels:
    app.kubernetes.io/name: torrents-restarter
    app.kubernetes.io/part-of: homelab-media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: torrents-restarter
  namespace: plexapps
  labels:
    app.kubernetes.io/name: torrents-restarter
    app.kubernetes.io/part-of: homelab-media
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["torrents"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: torrents-restarter
  namespace: plexapps
  labels:
    app.kubernetes.io/name: torrents-restarter
    app.kubernetes.io/part-of: homelab-media
subjects:
  - kind: ServiceAccount
    name: torrents-restarter
    namespace: plexapps
roleRef:
  kind: Role
  name: torrents-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: torrents-vpn-refresh
  namespace: plexapps
  labels:
    app.kubernetes.io/name: torrents-vpn-refresh
    app.kubernetes.io/part-of: homelab-media
spec:
  schedule: "0 4 */4 * *" # At 04:00 every 4 days
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: torrents-vpn-refresh
        spec:
          serviceAccountName: torrents-restarter
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - kubectl
                - rollout
                - restart
                - deployment/torrents
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

