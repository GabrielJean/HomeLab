apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: plexapps
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: homelab-media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "qbittorrent.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: torrents
          port: 8087
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
  namespace: plexapps
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/part-of: homelab-media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "transmission.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: torrents
          port: 9091
