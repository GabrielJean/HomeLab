apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flaresolverr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: homelab-media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "flaresolverr.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flaresolverr
          port: 8191
