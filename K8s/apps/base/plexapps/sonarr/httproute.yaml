apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: homelab-media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sonarr.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sonarr
          port: 8989
