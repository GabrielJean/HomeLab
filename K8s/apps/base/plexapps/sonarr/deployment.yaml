apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: plexapps
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: homelab-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-1
      containers:
        - name: sonarr
          image: linuxserver/sonarr:4.0.19
          env:
            - name: PUID
              value: "950"
            - name: PGID
              value: "950"
            - name: TZ
              value: America/Toronto
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: medias
              mountPath: /medias
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: medias
          persistentVolumeClaim:
            claimName: medias-pvc
