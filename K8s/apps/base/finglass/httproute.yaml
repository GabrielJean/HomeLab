apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finglass
  namespace: finglass
  labels:
    app.kubernetes.io/name: finglass
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "finglass.${CLUSTER_DOMAIN:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: finglass
          port: 8000
