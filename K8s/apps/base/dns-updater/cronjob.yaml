apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-updater
  namespace: dns-updater
  labels:
    app.kubernetes.io/name: dns-updater
    app.kubernetes.io/part-of: homelab-apps
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dns-updater
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dns-updater
              image: mcr.microsoft.com/azure-cli:2.91.0
              imagePullPolicy: IfNotPresent
              command: ["/scripts/update_dns.sh"]
              envFrom:
                - configMapRef:
                    name: dns-updater-config
                - secretRef:
                    name: dns-updater-azure-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts/update_dns.sh
                  subPath: update_dns.sh
          volumes:
            - name: script
              configMap:
                name: dns-updater-script
                defaultMode: 0755

