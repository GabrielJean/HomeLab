apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dns-updater-azure-secret
  namespace: dns-updater
  labels:
    app.kubernetes.io/name: dns-updater
    app.kubernetes.io/part-of: homelab-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: dns-updater-azure-secret
    creationPolicy: Owner
  data:
    - secretKey: AZURE_SECRET
      remoteRef:
        key: k8s-app-secret

