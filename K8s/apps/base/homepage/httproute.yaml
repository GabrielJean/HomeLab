apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab-apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "homepage.${CLUSTER_NAME:=talos-1}.gwebs.ca"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homepage
          port: 3000
