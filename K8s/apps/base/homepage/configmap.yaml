apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab-apps
data:
  kubernetes.yaml: |
    mode: cluster

  bookmarks.yaml: |
    ---
    # Bookmarks configuration
    # For options, see https://gethomepage.dev/configs/bookmarks/

  widgets.yaml: |
    - resources:
        label: System
        cpu: true
        memory: true
        uptime: true

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "k8s"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  settings.yaml: |
    title: My Homelab Dashboard
    theme: dark
    headerStyle: underlined

    background:
      image: https://images.pexels.com/photos/1485894/pexels-photo-1485894.jpeg?cs=srgb&dl=pexels-maoriginalphotography-1485894.jpg&fm=jpg&w=6000&h=4002
      blur: sm
      saturate: 50
      brightness: 50

    favicon: https://gethomepage.dev/assets/favicon.ico

    update_check: true

    allowed_hosts:
      - homepage.talos-1.gwebs.ca
      - homepage.talos-2.gwebs.ca
      - homepage.docker-1.gwebs.ca
      - homepage.docker-2.gwebs.ca
      - localhost
      - 127.0.0.1

    useEqualHeights: true
    hideVersion: true
    hideFooter: true
    showStats: true
    hideQuickLaunch: true

    layout:
      Home 1:
        icon: mdi-home
        style: column
        columns: 1
        Infrastructure:
          icon: mdi-server
          style: row
          columns: 4
        Media:
          icon: mdi-play-circle-outline
          style: row
          columns: 4
        Monitoring:
          icon: mdi-chart-areaspline
          style: row
          columns: 4
        Tools:
          icon: mdi-tools
          style: row
          columns: 4
        Network:
          icon: mdi-shield-check-outline
          style: row
          columns: 4
        Home Automation:
          icon: mdi-home-assistant
          style: row
          columns: 4

      Home 2:
        icon: mdi-home-outline
        style: column
        columns: 1
        Infrastructure:
          icon: mdi-server
          style: row
          columns: 4
        Monitoring:
          icon: mdi-chart-areaspline
          style: row
          columns: 4
        Tools:
          icon: mdi-tools
          style: row
          columns: 4
        Network:
          icon: mdi-shield-check-outline
          style: row
          columns: 4
        Home Automation:
          icon: mdi-home-assistant
          style: row
          columns: 4

    customCss: []
    customJs: []

  services.yaml: |
    - Home 1:
        - Infrastructure:
            - Traefik:
                href: https://traefik.docker-1.gwebs.ca
                icon: traefik.png
                description: Reverse proxy and ingress routing
                widget:
                  type: traefik
                  url: https://traefik.docker-1.gwebs.ca
            - Proxmox (PVE 1):
                href: https://pve-1.gwebs.ca:8006
                icon: proxmox.png
                description: Virtualization host management
                widget:
                  type: proxmox
                  url: https://pve-1.gwebs.ca:8006
                  username: "root@pam!homepage"
                  password: "{{HOMEPAGE_VAR_PVE1_PASSWORD}}"
            - Proxmox Datacenter Manager:
                href: https://pdm-1.gwebs.ca:8443/
                icon: proxmox.png
                description: Multi-node Proxmox fleet management
            - Proxmox Backup Server:
                href: https://pbs-2.gwebs.ca:8007
                icon: proxmox.png
                description: Backup server management
            - Portainer:
                href: https://portainer.docker-1.gwebs.ca
                icon: portainer.png
                description: Container and stack management
                widget:
                  type: portainer
                  url: https://portainer.docker-1.gwebs.ca
                  env: 2
                  key: "{{HOMEPAGE_VAR_PORTAINER1_KEY}}"
            - Termix:
                href: https://termix.talos-1.gwebs.ca
                icon: termix.png
                description: Browser-based terminal access
            - Headlamp:
                href: https://headlamp.talos-1.gwebs.ca
                icon: headlamp.png
                description: Kubernetes cluster dashboard
            - Backblaze:
                href: https://secure.backblaze.com/
                icon: backblaze.png
                description: Cloud backup and storage

        - Media:
            - Plex:
                href: https://app.plex.tv
                icon: plex.png
                description: Personal media streaming server
            - Overseerr:
                href: https://overseerr.docker-1.gwebs.ca
                icon: overseerr.png
                description: Media request management
            - Sonarr:
                href: https://sonarr.docker-1.gwebs.ca
                icon: sonarr.png
                description: TV series library automation
                widget:
                  type: sonarr
                  url: https://sonarr.docker-1.gwebs.ca
                  key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            - Radarr:
                href: https://radarr.docker-1.gwebs.ca
                icon: radarr.png
                description: Movie library automation
                widget:
                  type: radarr
                  url: https://radarr.docker-1.gwebs.ca
                  key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            - Jackett:
                href: https://jackett.docker-1.gwebs.ca
                icon: jackett.png
                description: Torrent indexer aggregation
                widget:
                  type: jackett
                  url: https://jackett.docker-1.gwebs.ca
            - Transmission:
                href: https://transmission.docker-1.gwebs.ca/transmission/web/
                icon: transmission.png
                description: BitTorrent download client
            - qBittorrent:
                href: https://qbittorrent.docker-1.gwebs.ca
                icon: qbittorrent.png
                description: BitTorrent download client

        - Monitoring:
            - Grafana:
                href: https://grafana.docker-1.gwebs.ca
                icon: grafana.png
                description: Metrics dashboards and visualization
            - Prometheus:
                href: https://prometheus.docker-1.gwebs.ca
                icon: prometheus.png
                description: Metrics collection and alerting
                widget:
                  type: prometheus
                  url: https://prometheus.docker-1.gwebs.ca
            - Healthchecks:
                href: https://healthchecks.docker-1.gwebs.ca
                icon: healthchecks.png
                description: Cron and job monitoring
            - Upsnap:
                href: http://192.168.10.11:8090
                icon: upsnap.png
                description: Wake-on-LAN device control

        - Tools:
            - Stirling-PDF:
                href: https://pdf.docker-1.gwebs.ca
                icon: stirling-pdf.png
                description: PDF conversion and editing tools
            - Gitea:
                href: https://gitea.docker-1.gwebs.ca
                icon: gitea.png
                description: Self-hosted Git service
            - AI:
                href: https://ai.docker-1.gwebs.ca
                icon: open-webui.png
                description: AI chat and model interface
            - n8n:
                href: https://n8n.docker-1.gwebs.ca
                icon: n8n.png
                description: Workflow automation platform

        - Network:
            - AdGuard Home:
                href: http://192.168.10.5:3080
                icon: adguard-home.png
                description: Network-wide DNS filtering
                widget:
                  type: adguard
                  url: http://192.168.10.5:3080
                  username: "gabriel"
                  password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

        - Home Automation:
            - HomeAssistant:
                href: http://192.168.10.11:8123
                icon: home-assistant.png
                description: Smart home automation hub

    - Home 2:
        - Infrastructure:
            - Proxmox (PVE 2):
                href: https://pve-2.gwebs.ca:8006
                icon: proxmox.png
                description: Virtualization host management
                widget:
                  type: proxmox
                  url: https://pve-2.gwebs.ca:8006
                  username: "root@pam!homepage"
                  password: "{{HOMEPAGE_VAR_PVE2_PASSWORD}}"
            - Proxmox Datacenter Manager:
                href: https://pdm-1.gwebs.ca:8443/
                icon: proxmox.png
                description: Multi-node Proxmox fleet management
            - Portainer:
                href: https://portainer.docker-2.gwebs.ca
                icon: portainer.png
                description: Container and stack management
                widget:
                  type: portainer
                  url: https://portainer.docker-2.gwebs.ca
                  env: 2
                  key: "{{HOMEPAGE_VAR_PORTAINER2_KEY}}"
            - Termix:
                href: https://termix.talos-2.gwebs.ca
                icon: termix.png
                description: Browser-based terminal access
            - Headlamp:
                href: https://headlamp.talos-2.gwebs.ca
                icon: headlamp.png
                description: Kubernetes cluster dashboard

        - Monitoring:
            - Upsnap:
                href: http://192.168.15.11:8090
                icon: upsnap.png
                description: Wake-on-LAN device control

        - Tools:
            - Stirling-PDF:
                href: https://pdf.docker-2.gwebs.ca
                icon: stirling-pdf.png
                description: PDF conversion and editing tools

        - Network:
            - AdGuard Home:
                href: http://192.168.15.5:3080
                icon: adguard-home.png
                description: Network-wide DNS filtering
                widget:
                  type: adguard
                  url: http://192.168.15.5:3080
                  username: "gabriel"
                  password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

        - Home Automation:
            - HomeAssistant:
                href: http://192.168.15.11:8123
                icon: home-assistant.png
                description: Smart home automation hub
