apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - service.yaml
  - deployment.yaml
  - httproute.yaml

configMapGenerator:
  - name: homepage-config
    files:
      - configs/settings.yaml
      - configs/services.yaml
      - configs/widgets.yaml
      - configs/kubernetes.yaml
      - configs/bookmarks.yaml
    options:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/part-of: homelab-apps
