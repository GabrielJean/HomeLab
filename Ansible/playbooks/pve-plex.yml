- name: Install NVIDIA drivers on Plex-1
  hosts: Plex-1
  order: sorted
  become: true

  tasks:
    - name: Install nvidia-headless-580-server
      ansible.builtin.apt:
        name: nvidia-headless-580-server
        state: present

    - name: Install nvidia-utils-580-server
      ansible.builtin.apt:
        name: nvidia-utils-580-server
        state: present

    - name: Install libnvidia-encode-580-server
      ansible.builtin.apt:
        name: libnvidia-encode-580-server
        state: present
